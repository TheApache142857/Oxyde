[package]
name = "oxyde-app"
description = "The Oxyde desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "oxyde"
path = "src/main.rs"

[dependencies]
oxyde-geom = { workspace = true }
oxyde-kernel = { workspace = true }
oxyde-occt = { workspace = true, optional = true }
oxyde-native-kernel = { workspace = true, optional = true }
oxyde-model = { workspace = true }
oxyde-sketch = { workspace = true }
oxyde-assembly = { workspace = true }
oxyde-format = { workspace = true }
oxyde-cadmpeg = { workspace = true, optional = true }
oxyde-render = { workspace = true }
oxyde-sim = { workspace = true }
oxyde-sim-gpu = { workspace = true }
oxyde-flow = { workspace = true }
eframe = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The kernels compiled in; the session's is chosen at start (src/kernel.rs). At least one.
default = ["occt", "native", "cadmpeg"]
occt = ["dep:oxyde-occt"]
native = ["dep:oxyde-native-kernel"]
# Importing other programs' files (SolidWorks, Fusion 360, Inventor...) through cadmpeg.
cadmpeg = ["dep:oxyde-cadmpeg"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
pollster = "0.3"
