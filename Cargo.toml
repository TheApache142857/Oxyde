[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/TheApache142857/oxyde"
publish = false

[workspace.dependencies]
oxyde-geom = { path = "crates/oxyde-geom" }
oxyde-sketch = { path = "crates/oxyde-sketch" }
oxyde-kernel = { path = "crates/oxyde-kernel" }
oxyde-occt = { path = "crates/oxyde-occt" }
oxyde-model = { path = "crates/oxyde-model" }
oxyde-assembly = { path = "crates/oxyde-assembly" }
oxyde-format = { path = "crates/oxyde-format" }
oxyde-render = { path = "crates/oxyde-render" }
oxyde-cli = { path = "crates/oxyde-cli" }
oxyde-mcp = { path = "crates/oxyde-mcp" }
oxyde-sim = { path = "crates/oxyde-sim" }
oxyde-sim-gpu = { path = "crates/oxyde-sim-gpu" }
oxyde-flow = { path = "crates/oxyde-flow" }
oxyde-solidcore = { path = "crates/oxyde-solidcore" }

# SolidCraft's kernel (Apache-2.0), pinned to one commit of its repository; the crates live in
# its solidcore/ folder. Only oxyde-solidcore uses them, behind oxyde-app's `solidcore` feature.
solidcore = { git = "https://github.com/tangency-labs/solidcraft", rev = "b369833d71347964d2cdc439377684375bb6a6bb" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft", rev = "b369833d71347964d2cdc439377684375bb6a6bb" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft", rev = "b369833d71347964d2cdc439377684375bb6a6bb" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft", rev = "b369833d71347964d2cdc439377684375bb6a6bb" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcraft", rev = "b369833d71347964d2cdc439377684375bb6a6bb" }

# FieldCraft's mesher (MIT OR Apache-2.0), pinned to one commit of its repository. Only
# oxyde-sim uses it, behind its `fieldcraft` feature.
fieldcraft-mesh = { git = "https://github.com/tangency-labs/fieldcraft", rev = "655d92fe9072158200dc1f27746905c1f2a4e48e" }

clap = { version = "4.6", features = ["derive"] }
cxx = "1.0"
cxx-build = "1.0"
eframe = { version = "0.29", features = ["wgpu"] }
png = "0.18"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1.10", features = ["v4"] }
# The version and features eframe brings (no Direct3D 12: eframe leaves it out, and it
# would add crates), for oxyde-sim-gpu's compute shaders.
wgpu = { version = "22.1", default-features = false, features = ["wgsl"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# The software renderer is far too slow unoptimized; keep it fast in debug builds.
[profile.dev.package.oxyde-render]
opt-level = 3

# The finite element solver too: a study would take minutes unoptimized.
[profile.dev.package.oxyde-sim]
opt-level = 3

# And its GPU side, which converts every solve's arrays for the card.
[profile.dev.package.oxyde-sim-gpu]
opt-level = 3

# The MCP server's mesh sampling and probing (compare, probe) would take minutes unoptimized.
[profile.dev.package.oxyde-mcp]
opt-level = 3

# FieldCraft's mesher with oxyde-sim's `fieldcraft` feature, compared with the others' times.
[profile.dev.package.fieldcraft-mesh]
opt-level = 3

[profile.dev.package.fieldcraft-model]
opt-level = 3

[profile.dev.package.fieldcraft-parallel]
opt-level = 3
