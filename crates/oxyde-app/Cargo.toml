[package]
name = "oxyde-app"
description = "The Oxyde desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "oxyde"
path = "src/main.rs"

[dependencies]
oxyde-geom = { workspace = true }
oxyde-kernel = { workspace = true }
oxyde-occt = { workspace = true }
oxyde-solidcore = { workspace = true, optional = true }
oxyde-model = { workspace = true }
oxyde-sketch = { workspace = true }
oxyde-assembly = { workspace = true }
oxyde-format = { workspace = true }
oxyde-render = { workspace = true }
oxyde-sim = { workspace = true }
oxyde-sim-gpu = { workspace = true }
oxyde-flow = { workspace = true }
oxyde-mcp = { workspace = true }
eframe = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# SolidCraft's kernel as a second choice at start (src/kernel.rs), off by default: the spike.
solidcore = ["dep:oxyde-solidcore"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
pollster = "0.3"
