[package]
name = "oxyde-sim"
description = "Finite element simulation for Oxyde: a tetrahedral mesher, a linear static solver, result plots."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fieldcraft-mesh = { workspace = true, optional = true }

[features]
# FieldCraft's tetrahedral mesher as a third mesher, off by default: the spike.
fieldcraft = ["dep:fieldcraft-mesh"]
