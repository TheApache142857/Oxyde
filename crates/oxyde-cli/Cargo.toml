[package]
name = "oxyde-cli"
description = "Headless command line for Oxyde parts: evaluate, check, export and snapshot without the application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxyde-cli"
path = "src/main.rs"

[dependencies]
oxyde-geom = { workspace = true }
oxyde-kernel = { workspace = true }
oxyde-occt = { workspace = true }
oxyde-model = { workspace = true }
oxyde-format = { workspace = true }
oxyde-render = { workspace = true }
clap = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
