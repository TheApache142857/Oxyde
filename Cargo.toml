[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.10"
edition = "2024"
license = "MIT"
repository = "https://github.com/TheApache142857/oxyde"
publish = false

[workspace.dependencies]
oxyde-geom = { path = "crates/oxyde-geom" }
oxyde-sketch = { path = "crates/oxyde-sketch" }
oxyde-kernel = { path = "crates/oxyde-kernel" }
oxyde-occt = { path = "crates/oxyde-occt" }
oxyde-model = { path = "crates/oxyde-model" }
oxyde-assembly = { path = "crates/oxyde-assembly" }
oxyde-format = { path = "crates/oxyde-format" }
oxyde-render = { path = "crates/oxyde-render" }
oxyde-cli = { path = "crates/oxyde-cli" }
oxyde-mcp = { path = "crates/oxyde-mcp" }
oxyde-sim = { path = "crates/oxyde-sim" }
oxyde-sim-gpu = { path = "crates/oxyde-sim-gpu" }
oxyde-flow = { path = "crates/oxyde-flow" }

clap = { version = "4.6", features = ["derive"] }
cxx = "1.0"
cxx-build = "1.0"
eframe = { version = "0.29", features = ["wgpu"] }
png = "0.18"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1.10", features = ["v4"] }
# The version and features eframe brings (no Direct3D 12: eframe leaves it out, and it
# would add crates), for oxyde-sim-gpu's compute shaders.
wgpu = { version = "22.1", default-features = false, features = ["wgsl"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# The software renderer is far too slow unoptimized; keep it fast in debug builds.
[profile.dev.package.oxyde-render]
opt-level = 3

# The finite element solver too: a study would take minutes unoptimized.
[profile.dev.package.oxyde-sim]
opt-level = 3

# And its GPU side, which converts every solve's arrays for the card.
[profile.dev.package.oxyde-sim-gpu]
opt-level = 3

# The MCP server's mesh sampling and probing (compare, probe) would take minutes unoptimized.
[profile.dev.package.oxyde-mcp]
opt-level = 3
